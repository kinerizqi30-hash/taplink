<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muhammad Rizqi - Kartu Nama Digital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Glows */
        .bg-glow-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 410px;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 32px 22px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 1;
            margin: auto;
        }

        /* Share Button */
        .top-share-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .top-share-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Avatar Container */
        .profile-img-container {
            position: relative;
            width: 108px;
            height: 108px;
            margin: 0 auto 18px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            background: #1e293b;
        }

        .profile-img-container::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .verified-badge {
            color: #38bdf8;
            font-size: 16px;
        }

        .role-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .bio {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.5;
            padding: 0 8px;
            font-weight: 400;
        }

        /* Quick Action Row */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 8px;
            border-radius: 16px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-item i {
            font-size: 18px;
        }

        .action-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Main Links Stack */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .link-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.12);
        }

        .link-btn .left-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .link-btn .arrow-icon {
            font-size: 12px;
            color: #64748b;
        }

        /* Brand Colors */
        .wa-bg {
            background: rgba(37, 211, 102, 0.15);
            color: #25d366;
        }

        .ig-bg {
            background: rgba(225, 48, 108, 0.15);
            color: #e1306c;
        }

        .tt-bg {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .web-bg {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .mail-bg {
            background: rgba(250, 204, 21, 0.15);
            color: #facc15;
        }

        .footer {
            margin-top: 26px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- Tombol Bagikan -->
        <button class="top-share-btn" onclick="copyProfileLink()" title="Bagikan Profil">
            <i class="fa-solid fa-share-nodes"></i>
        </button>

        <!-- Foto Profil -->
        <div class="profile-img-container">
            <img src="foto.jpeg" alt="Muhammad Rizqi" class="profile-img"
                onerror="this.src='https://placehold.co/128x128/6366f1/ffffff?text=MR'">
        </div>

        <!-- Nama & Verified Badge -->
        <div class="name-wrapper">
            <h1 class="name">Muhammad Rizqi</h1>
            <i class="fa-solid fa-circle-check verified-badge" title="Terverifikasi"></i>
        </div>

        <div class="role-tag">Global Institute</div>

        <!-- Bio Profil -->
        <p class="bio">
            Mahasiswa Global Institute<br>
            <span style="color: #cbd5e1; font-weight: 500;">Kasir Finance & Marketing</span>
        </p>

        <!-- Akses Cepat (Quick Actions) -->
        <div class="quick-actions">
            <a href="https://wa.me/6289525935034" target="_blank" class="action-item">
                <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i>
                <span>Chat WA</span>
            </a>
            <a href="tel:6289525935034" class="action-item">
                <i class="fa-solid fa-phone" style="color: #38bdf8;"></i>
                <span>Telepon</span>
            </a>
            <!-- Tombol Salin Email Cepat -->
            <div class="action-item" onclick="copyEmail()">
                <i class="fa-solid fa-copy" style="color: #facc15;"></i>
                <span>Salin Email</span>
            </div>
        </div>

        <!-- Daftar Tautan Utama -->
        <div class="links-container">
            <a href="https://wa.me/6289525935034" target="_blank" class="link-btn">
                <div class="left-content">
                    <div class="icon-box wa-bg">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <span>WhatsApp Kami</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://www.instagram.com/rizqi067?mdxt=ZzlraWNpenNyNnV0" target="_blank" class="link-btn">
                <div class="left-content">
                    <div class="icon-box ig-bg">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span>Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://tiktok.com/@kinerizqi" target="_blank" class="link-btn">
                <div class="left-content">
                    <div class="icon-box tt-bg">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <span>TikTok</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://mitrarating.com" target="_blank" class="link-btn">
                <div class="left-content">
                    <div class="icon-box web-bg">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <span>Website Resmi</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Tombol Kirim Email dengan Fungsi Pintar (Automatic Fallback) -->
            <div class="link-btn" onclick="openEmail()">
                <div class="left-content">
                    <div class="icon-box mail-bg">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <span>Kirim Email</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>&copy; 2026 Kartu Nama Digital</span>
            <span style="font-weight: 600; color: #818cf8;">Rizqi Profile</span>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
        <span id="toast-msg">Notifikasi</span>
    </div>

    <!-- SCRIPT JAVASCRIPT PERBAIKAN EMAIL -->
    <script>
        const EMAIL_ADDRESS = "kinerizqi30@gmail.com";

        // Fungsi Membuka Email dengan Fallback ke Gmail Web
        function openEmail() {
            let start = Date.now();

            // 1. Coba buka aplikasi email bawaan HP (mailto)
            window.location.href = "mailto:" + EMAIL_ADDRESS;

            // 2. Jika dalam 500ms aplikasi email HP tidak merespons/membuka, alihkan ke Gmail Web
            setTimeout(function () {
                if (Date.now() - start < 1000) {
                    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${EMAIL_ADDRESS}`, '_blank');
                }
            }, 500);
        }

        // Fungsi Salin Email ke Clipboard
        function copyEmail() {
            navigator.clipboard.writeText(EMAIL_ADDRESS).then(() => {
                showToast("Email berhasil disalin ke papan klip!");
            }).catch(() => {
                showToast("Email: " + EMAIL_ADDRESS);
            });
        }

        // Fungsi Bagikan Profil
        function copyProfileLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'Muhammad Rizqi - Kartu Nama Digital',
                    url: window.location.href
                }).catch(() => { });
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast("Tautan profil berhasil disalin!");
                });
            }
        }

        // Fungsi Toast Popup
        function showToast(message) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toast-msg");
            toastMsg.innerText = message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }
    </script>
</body>

</html>
